  # ============================================================
  # WebSocket Connection
  # ============================================================
  /ws:
    get:
      tags:
        - WebSocket
      summary: WebSocket connection
      description: |
        Establishes a WebSocket connection for real-time chat.

        Connection URL: `ws://localhost:3000/ws?token=<access_token>`

        ## Message Types

        ### Client -> Server
        - `CONNECTED` - Sent by server on successful connection
        - `USER_MESSAGE` - Send a message to the chat
        - `JOIN_CHAT` - Join a chat room
        - `LEAVE_CHAT` - Leave a chat room
        - `TYPING_START` - User started typing
        - `TYPING_STOP` - User stopped typing
        - `PING` - Heartbeat ping

        ### Server -> Client
        - `CONNECTED` - Connection established
        - `USER_MESSAGE` - New user message
        - `ASSISTANT_MESSAGE_CHUNK` - Streaming AI response chunk
        - `ASSISTANT_MESSAGE_DONE` - AI response complete
        - `USER_TYPING` - Another user is typing
        - `ERROR` - Error occurred
        - `PONG` - Heartbeat response
      operationId: websocketConnection
      parameters:
        - name: token
          in: query
          required: true
          description: JWT access token
          schema:
            type: string
      responses:
        '101':
          description: WebSocket connection established

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (7 day expiration)

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortByParam:
      name: sortBy
      in: query
      description: Field to sort by
      schema:
        type: string

    SortOrderParam:
      name: sortOrder
      in: query
      description: Sort order
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    CharacterId:
      name: characterId
      in: path
      required: true
      description: Character ID
      schema:
        type: string
        format: uuid

    ChatId:
      name: chatId
      in: path
      required: true
      description: Chat ID
      schema:
        type: string
        format: uuid

  schemas:
    # ============================================================
    # Common Schemas
    # ============================================================
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Password reset token from email
        password:
          type: string
          minLength: 8
          description: New password (minimum 8 characters)

    OAuthExchangeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Short-lived auth code from OAuth callback (30s TTL)

    MfaSetupResponse:
      type: object
      properties:
        qrDataUrl:
          type: string
          description: QR code as data URL for authenticator app
        secret:
          type: string
          description: TOTP secret key (base32 encoded)

    MfaCodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit TOTP code from authenticator app

    MfaChallengeRequest:
      type: object
      required:
        - mfaToken
        - code
      properties:
        mfaToken:
          type: string
          description: MFA token issued during login (5-minute TTL)
        code:
          type: string
          description: 6-digit TOTP code or backup code

    BackupCodesResponse:
      type: object
      properties:
        backupCodes:
          type: array
          items:
            type: string
          description: 10 single-use backup codes

    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
        content:
          type: string
        importance:
          type: number
          format: float
          description: Importance score (0-1)
        accessCount:
          type: integer
        lastAccessedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ExtractMemoriesRequest:
      type: object
      required:
        - chatId
      properties:
        chatId:
          type: string
          format: uuid

    EmotionState:
      type: object
      properties:
        current:
          type: object
          properties:
            valence:
              type: number
              format: float
              description: Pleasure dimension (-1 to 1)
            arousal:
              type: number
              format: float
              description: Energy dimension (-1 to 1)
            label:
              type: string
              description: Human-readable emotion label
        history:
          type: array
          items:
            type: object
            properties:
              valence:
                type: number
              arousal:
                type: number
              timestamp:
                type: string
                format: date-time

    EmotionUpdateRequest:
      type: object
      required:
        - valence
        - arousal
      properties:
        valence:
          type: number
          format: float
          minimum: -1
          maximum: 1
        arousal:
          type: number
          format: float
          minimum: -1
          maximum: 1

    IntelligenceDebugState:
      type: object
      properties:
        memoryRetrievalLog:
          type: array
          items:
            type: object
        emotionTimeline:
          type: array
          items:
            type: object
        extractionLog:
          type: array
          items:
            type: object
        performanceMetrics:
          type: object
          properties:
            memoryRetrievalMs:
              type: number
            emotionComputeMs:
              type: number
            totalInjectionMs:
              type: number

    Follow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        followerId:
          type: string
          format: uuid
        followingId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Favorite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
        content:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        replyCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        parentId:
          type: string
          format: uuid
          description: Parent comment ID for replies

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - follow
            - favorite
            - comment
            - reply
            - system
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    SubmitReportRequest:
      type: object
      required:
        - targetType
        - targetId
        - reason
      properties:
        targetType:
          type: string
          enum:
            - character
            - comment
            - user
        targetId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 10
          maxLength: 1000

    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        targetType:
          type: string
        targetId:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
          enum:
            - pending
            - resolved
            - dismissed
        createdAt:
          type: string
          format: date-time

    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: Event types to subscribe to
        secret:
          type: string
          description: HMAC signing secret (masked in responses)
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required:
        - url
        - events

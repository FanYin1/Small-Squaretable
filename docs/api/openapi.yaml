            type: string
            minLength: 1
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: tags
          in: query
          description: Filter by tags (comma-separated)
          schema:
            type: string
            example: "helper,coding"
        - name: sort
          in: query
          description: Sort order
          schema:
            type: string
            enum: [popular, newest, rating, relevance]

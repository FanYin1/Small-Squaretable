openapi: 3.1.0
info:
  title: Small Squaretable API
  description: |
    Enterprise-grade multi-tenant SaaS platform for AI chat and character management.

    ## Authentication

    Most endpoints require authentication via JWT Bearer tokens. Include the access token in the Authorization header:

    ```
    Authorization: Bearer <your_access_token>
    ```

    ## Error Handling

    All errors follow a standard format:

    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Human-readable error message",
        "details": {}
      },
      "meta": {
        "timestamp": "2026-02-04T12:00:00.000Z"
      }
    }
    ```

    ## Pagination

    List endpoints support pagination via query parameters:

    - `page`: Page number (default: 1)
    - `limit`: Items per page (default: 20, max: 100)
    - `sortBy`: Field to sort by
    - `sortOrder`: Sort order (asc/desc, default: desc)

    ## Caching

    Some endpoints use Redis caching. Check the `X-Cache` response header:
    - `HIT`: Response served from cache
    - `MISS`: Response served from database

  version: 0.1.0
  contact:
    name: Small Squaretable Team
    url: https://github.com/small-squaretable
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.small-squaretable.com
    description: Production server

tags:
  - name: Authentication
    description: User registration and authentication
  - name: Users
    description: User profile management
  - name: Characters
    description: Character CRUD and marketplace
  - name: Chats
    description: Chat and message management
  - name: LLM
    description: AI model integration
  - name: Subscriptions
    description: Subscription and billing
  - name: Usage
    description: Usage tracking and quotas
  - name: Health
    description: Health check endpoints
  - name: WebSocket
    description: Real-time communication
  - name: MFA
    description: Two-factor authentication
  - name: OAuth
    description: OAuth2 social login
  - name: Intelligence
    description: Character memory and emotion system
  - name: Social
    description: Follow, favorites, and comments
  - name: Notifications
    description: In-app notifications
  - name: Webhooks
    description: Webhook endpoint management
  - name: Developer
    description: API key management
  - name: Plugins
    description: Plugin lifecycle and marketplace
  - name: Analytics
    description: Data analytics dashboard
  - name: Recommendations
    description: Character recommendations
  - name: GDPR
    description: Data privacy and consent
  - name: Reports
    description: Content reporting
  - name: Admin
    description: Administration panel

paths:
  # ============================================================
  # Health Endpoints
  # ============================================================
  /health:
    get:
      tags:
        - Health
      summary: Basic health check
      description: Returns basic application status
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 0.1.0

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Kubernetes liveness probe - checks if server is running
      operationId: livenessProbe
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: Kubernetes readiness probe - checks database and Redis connectivity
      operationId: readinessProbe
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  # ============================================================
  # Authentication Endpoints
  # ============================================================
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account with Free subscription
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticates a user and returns tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Uses a refresh token to get a new access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Invalidates the refresh token
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Returns the currently authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Sends a password reset email. Always returns 200 to prevent email enumeration.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Reset email sent (if account exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          description: Rate limited

  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      description: Resets password using a token from the reset email
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/verify-email:
    get:
      tags:
        - Authentication
      summary: Verify email address
      description: Verifies email using token from verification email
      operationId: verifyEmail
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend verification email
      description: Resends the email verification link. Rate limited.
      operationId: resendVerification
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limited

  # ============================================================
  # OAuth Endpoints
  # ============================================================
  /api/v1/auth/oauth/{provider}:
    get:
      tags:
        - OAuth
      summary: Redirect to OAuth provider
      description: Generates state and PKCE code verifier, stores in Redis, and redirects to the OAuth provider authorization URL.
      operationId: oauthRedirect
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
      responses:
        '302':
          description: Redirect to OAuth provider authorization URL

  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags:
        - OAuth
      summary: OAuth provider callback
      description: Handles the OAuth provider callback. Verifies state, exchanges code for tokens, authenticates user, and redirects to frontend with a short-lived auth code.
      operationId: oauthCallback
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend with auth code or error

  /api/v1/auth/oauth/exchange:
    post:
      tags:
        - OAuth
      summary: Exchange OAuth auth code for JWT
      description: Exchanges a short-lived auth code (from OAuth callback) for a JWT access/refresh token pair. Auth codes are single-use and expire in 30 seconds.
      operationId: oauthExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================
  # MFA Endpoints
  # ============================================================
  /api/v1/auth/mfa/setup:
    post:
      tags:
        - MFA
      summary: Start TOTP 2FA setup
      description: Generates a TOTP secret and QR code data URL for the authenticator app setup.
      operationId: mfaSetup
      security:
        - BearerAuth: []
      responses:
        '200':
          description: TOTP setup data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/mfa/verify-setup:
    post:
      tags:
        - MFA
      summary: Confirm TOTP setup
      description: Verifies the TOTP code from the authenticator app to complete 2FA setup. Returns backup codes on success.
      operationId: mfaVerifySetup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          description: 2FA enabled, backup codes returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BackupCodesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/mfa/disable:
    post:
      tags:
        - MFA
      summary: Disable 2FA
      description: Disables TOTP two-factor authentication. Requires a valid TOTP code to confirm.
      operationId: mfaDisable
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/mfa/challenge:
    post:
      tags:
        - MFA
      summary: MFA login challenge
      description: Completes MFA login by verifying a TOTP code or backup code against the MFA token issued during login. Rate limited to 5 attempts per token.
      operationId: mfaChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeRequest'
      responses:
        '200':
          description: MFA verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Too many attempts

  /api/v1/auth/mfa/backup-codes:
    get:
      tags:
        - MFA
      summary: Regenerate backup codes
      description: Regenerates a new set of 10 backup codes. Previous codes are invalidated.
      operationId: mfaBackupCodes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: New backup codes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BackupCodesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Intelligence Endpoints (Character Memory & Emotion)
  # ============================================================
  /api/v1/characters/{characterId}/intelligence/memories:
    get:
      tags:
        - Intelligence
      summary: List character memories
      description: Returns memories for a character, optionally filtered by query or chat session.
      operationId: listMemories
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: query
          in: query
          schema:
            type: string
          description: Search query for semantic memory retrieval
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: chatId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter memories by chat session
      responses:
        '200':
          description: Memory list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          memories:
                            type: array
                            items:
                              $ref: '#/components/schemas/Memory'
                          total:
                            type: integer
                          limit:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Intelligence
      summary: Clear all memories
      description: Deletes all memories for a character, optionally scoped to a chat session.
      operationId: clearMemories
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chatId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memories cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/characters/{characterId}/intelligence/memories/{memoryId}:
    delete:
      tags:
        - Intelligence
      summary: Delete a specific memory
      description: Deletes a single memory by ID.
      operationId: deleteMemory
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memory deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/characters/{characterId}/intelligence/extract-memories:
    post:
      tags:
        - Intelligence
      summary: Extract memories from chat
      description: Analyzes recent chat messages and extracts important facts as memories.
      operationId: extractMemories
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractMemoriesRequest'
      responses:
        '200':
          description: Memories extracted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          extracted:
                            type: integer
                            description: Number of memories extracted
                          memories:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/characters/{characterId}/intelligence/emotion:
    get:
      tags:
        - Intelligence
      summary: Get current emotion state
      description: Returns the current 2D valence-arousal emotion state and history for a character.
      operationId: getEmotion
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chatId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Emotion state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmotionState'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Intelligence
      summary: Update emotion manually
      description: Manually sets the valence-arousal emotion state for a character.
      operationId: updateEmotion
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chatId
          in: query
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmotionUpdateRequest'
      responses:
        '200':
          description: Emotion updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmotionState'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Intelligence
      summary: Reset emotion state
      description: Resets the emotion state to neutral (0, 0).
      operationId: resetEmotion
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Emotion reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/characters/{characterId}/intelligence/debug:
    get:
      tags:
        - Intelligence
      summary: Get debug state
      description: Returns the full intelligence debug state including memory retrieval logs, emotion timeline, and performance metrics.
      operationId: getDebugState
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chatId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Debug state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IntelligenceDebugState'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/characters/{characterId}/intelligence/system-prompt:
    get:
      tags:
        - Intelligence
      summary: Get system prompt details
      description: Returns the constructed system prompt with all injected context (memories, emotion, world info).
      operationId: getSystemPrompt
      security:
        - BearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chatId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: System prompt details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          prompt:
                            type: string
                          sections:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                content:
                                  type: string
                                tokenCount:
                                  type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Social Endpoints (Follow, Favorites, Comments)
  # ============================================================
  /api/v1/social/follows:
    post:
      tags:
        - Social
      summary: Follow a user
      operationId: followUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - followingId
              properties:
                followingId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Followed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Follow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/social/follows/{userId}:
    delete:
      tags:
        - Social
      summary: Unfollow a user
      operationId: unfollowUser
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/social/follows/{userId}/status:
    get:
      tags:
        - Social
      summary: Check follow status
      operationId: checkFollowStatus
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Follow status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          isFollowing:
                            type: boolean
                          isFollowedBy:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/social/users/{userId}/followers:
    get:
      tags:
        - Social
      summary: List followers
      operationId: listFollowers
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query

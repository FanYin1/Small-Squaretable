          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        createdAt:
          type: string
          format: date-time

    Attachment:
      type: object
      properties:
        type:
          type: string
          enum: [image, audio, video, file]
        url:
          type: string
          format: uri
        name:
          type: string
          maxLength: 255
        size:
          type: integer
        mimeType:
          type: string
          maxLength: 100

    CreateMessageRequest:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
          minLength: 1
          maxLength: 50000
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          maxItems: 10

    MessagesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        pagination:
          type: object
          properties:
            hasMore:
              type: boolean
            cursor:
              type: integer
              nullable: true

    # ============================================================
    # LLM Schemas
    # ============================================================
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Model ID to use
          example: gpt-3.5-turbo
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        maxTokens:
          type: integer
          minimum: 1
        n:
          type: integer
          minimum: 1
          default: 1
        stream:
          type: boolean
          default: false
        presencePenalty:
          type: number
          minimum: -2
          maximum: 2
          default: 0
        frequencyPenalty:
          type: number
          minimum: -2
          maximum: 2
          default: 0

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finishReason:
                type: string
        usage:
          type: object
          properties:
            promptTokens:
              type: integer
            completionTokens:
              type: integer
            totalTokens:
              type: integer

    CompletionRequest:
      type: object
      required: [model, prompt]
      properties:
        model:
          type: string
        prompt:
          type: string
        temperature:
          type: number
        maxTokens:
          type: integer

    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              index:
                type: integer
        usage:
          type: object
          properties:
            promptTokens:
              type: integer
            completionTokens:
              type: integer
            totalTokens:
              type: integer

    Model:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        created:
          type: integer
        ownedBy:
          type: string
          example: system

    ModelsResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    # ============================================================
    # Subscription Schemas
    # ============================================================
    SubscriptionStatus:
      type: object
      properties:
        subscription:
          type: object
          properties:
            plan:
              type: string
              enum: [free, pro, team]
            status:
              type: string
              enum: [active, past_due, canceled, trialing]
            currentPeriodEnd:
              type: string
              format: date-time
              nullable: true
            cancelAtPeriodEnd:
              type: boolean

    CheckoutRequest:
      type: object
      required: [priceId, successUrl, cancelUrl]
      properties:
        priceId:
          type: string
          description: Stripe price ID
        successUrl:
          type: string
          format: uri
          description: URL to redirect after successful payment
        cancelUrl:
          type: string
          format: uri
          description: URL to redirect after canceling payment

    SubscriptionConfig:
      type: object
      properties:
        publishableKey:
          type: string
          description: Stripe publishable key
        prices:
          type: object
          properties:
            proMonthly:
              type: string
              description: Pro monthly price ID
            proYearly:
              type: string
              description: Pro yearly price ID
            teamMonthly:
              type: string
              description: Team monthly price ID

    # ============================================================
    # Usage Schemas
    # ============================================================
    UsageStats:
      type: object
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        usage:
          type: object
          properties:
            messages:
              type: integer
            llmTokens:
              type: integer
            images:
              type: integer
            apiCalls:
              type: integer

    QuotaInfo:
      type: object
      properties:
        used:
          type: integer
        limit:
          type: integer
        remaining:
          type: integer
        percentage:
          type: number
          format: float
        resetsAt:
          type: string
          format: date-time

    # ============================================================
    # Response Templates
    # ============================================================
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                example:
                  message: Operation successful
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                  details:
                    type: object
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Invalid or missing authentication token
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: FORBIDDEN
                  message:
                    type: string
                    example: Insufficient permissions for this operation
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND
                  message:
                    type: string
                    example: The requested resource was not found
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: CONFLICT
                  message:
                    type: string
                    example: Resource already exists
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time

    QuotaExceeded:
      description: Quota exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: QUOTA_EXCEEDED
                  message:
                    type: string
                    example: Monthly quota exceeded
                  details:
                    type: object
                    properties:
                      resource:
                        type: string
                      used:
                        type: integer
                      limit:
                        type: integer
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_ERROR
                  message:
                    type: string
                    example: An unexpected error occurred
              meta:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
